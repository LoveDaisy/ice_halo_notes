[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo-notes"
version = "0.1.0"
description = "《现代冰晕研究漫谈》系列的画图 / 仿真胶水代码（系列级共享包）"
requires-python = ">=3.12"
dependencies = ["numpy", "matplotlib", "lumice-integral"]

# 晶体几何（Polyhedron / unfold / feasibility / enumerate）由 Lumice Integral 提供，本仓不再持有副本。
# 过渡形态：本地 path 依赖（绝对路径，uv.lock 随之不可跨机复现）；LI 正式发版后另立任务切到 git tag。
[tool.uv.sources]
lumice-integral = { path = "/Users/zhangjiajie/Codes/Lumice Integral", editable = true }

# 开发依赖走 PEP 735 dependency group：`uv sync` 默认装 dev 组，`uv run pytest` 直接可用
[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["halo_notes"]

[tool.pytest.ini_options]
markers = ["slow: 真跑 Lumice CLI，默认不执行（uv run pytest -m slow 才跑）"]
addopts = "-m 'not slow'"
