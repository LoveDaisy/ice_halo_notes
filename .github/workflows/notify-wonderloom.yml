name: Notify Wonderloom of published-source changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Wonderloom rebuild
        env:
          TOKEN: ${{ secrets.WONDERLOOM_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/LoveDaisy/wonderloom/actions/workflows/pages.yml/dispatches \
            --data "{\"ref\":\"main\",\"inputs\":{\"source_hint\":\"${SOURCE_SHA}\"}}"
